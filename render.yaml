services:
  - type: web
    name: gli-telegram-bildirim
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_TEST_CHAT_ID
        sync: false
      - key: RELAY_SHARED_SECRET
        generateValue: true
